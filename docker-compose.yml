# Entorno local completo:
#   docker compose up                      -> base de datos, backend y frontend
#   docker compose --profile telegram up   -> además, el bot de Telegram
# La IA (Ollama) se ejecuta fuera de Docker, en tu ordenador: en Mac es mucho más rápida así.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alma
      POSTGRES_USER: alma
      POSTGRES_PASSWORD: alma
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alma -d alma"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://alma:alma@db:5432/alma
      OLLAMA_URL: http://host.docker.internal:11434
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  bot:
    profiles: ["telegram"]
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://alma:alma@db:5432/alma
      OLLAMA_URL: http://host.docker.internal:11434
    command: python manage.py run_bot
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
